<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pencarian Tugas - WorkLog Tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; color: #0f172a; }
        .card { border: 1px solid #e2e8f0; border-radius: 12px; }
        .btn-primary { background-color: #2563eb; border-color: #2563eb; }
    </style>
</head>
<body class="d-flex flex-column min-vh-100">

    <nav class="navbar navbar-expand-lg bg-white border-bottom sticky-top py-3">
        <div class="container">
            <a class="navbar-brand text-primary fw-bold d-flex align-items-center gap-2" href="/">
                <i class="bi bi-check2-square fs-4"></i>
                <span>WorkLog</span>
            </a>
            <div class="navbar-nav ms-auto gap-2">
                <a class="btn btn-outline-secondary btn-sm rounded-pill px-3" href="/projects">
                    <i class="bi bi-folder2-open me-1"></i> Proyek
                </a>
            </div>
        </div>
    </nav>

    <main class="container py-4 flex-grow-1">

        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h4 class="fw-bold mb-1">Pencarian &amp; Filter Tugas</h4>
                <p class="text-secondary small mb-0">Cari tugas spesifik berdasarkan kata kunci, status, atau prioritas</p>
            </div>
        </div>

        <!-- FORM FILTER -->
        <div class="card p-4 mb-4">
            <form th:action="@{/tasks/search}" method="get" class="row g-3">
                <div class="col-md-5">
                    <label class="form-label small fw-semibold text-secondary">Kata Kunci</label>
                    <div class="input-group">
                        <span class="input-group-text bg-white"><i class="bi bi-search"></i></span>
                        <input type="text" name="keyword" class="form-control" placeholder="Cari judul atau deskripsi..." th:value="${keyword}">
                    </div>
                </div>

                <div class="col-md-3">
                    <label class="form-label small fw-semibold text-secondary">Filter Status</label>
                    <select name="status" class="form-select">
                        <option value="">-- Semua Status --</option>
                        <option th:each="st : ${statuses}"
                                th:value="${st}"
                                th:text="${st}"
                                th:selected="${st == selectedStatus}"></option>
                    </select>
                </div>

                <div class="col-md-2">
                    <label class="form-label small fw-semibold text-secondary">Filter Prioritas</label>
                    <select name="priority" class="form-select">
                        <option value="">-- Semua --</option>
                        <option th:each="pr : ${priorities}"
                                th:value="${pr}"
                                th:text="${pr}"
                                th:selected="${pr == selectedPriority}"></option>
                    </select>
                </div>

                <div class="col-md-2 d-flex align-items-end gap-2">
                    <button type="submit" class="btn btn-primary w-100 rounded-3">Cari</button>
                    <a href="/tasks/search" class="btn btn-light rounded-3" title="Reset Filter"><i class="bi bi-arrow-counterclockwise"></i></a>
                </div>
            </form>
        </div>

        <!-- HASIL PENCARIAN -->
        <div class="card p-3">
            <div th:if="${#lists.isEmpty(tasks)}" class="text-center py-5 text-muted">
                <i class="bi bi-search display-6 mb-2"></i>
                <h6>Tidak ada tugas yang sesuai kriteria pencarian</h6>
            </div>

            <div class="table-responsive" th:unless="${#lists.isEmpty(tasks)}">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                        <tr>
                            <th>Judul Tugas</th>
                            <th>Proyek</th>
                            <th>Status</th>
                            <th>Prioritas</th>
                            <th class="text-end">Aksi</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="task : ${tasks}">
                            <td>
                                <strong th:text="${task.title}">Judul</strong>
                                <div class="text-muted small" th:text="${#strings.abbreviate(task.description, 60)}">Deskripsi...</div>
                            </td>
                            <td>
                                <a th:href="@{/projects/{id}(id=${task.project.id})}" class="text-decoration-none fw-semibold" th:text="${task.project.name}">Nama Proyek</a>
                            </td>
                            <td><span class="badge bg-light text-dark border" th:text="${task.status}">STATUS</span></td>
                            <td><span class="badge bg-secondary-subtle text-secondary" th:text="${task.priority}">PRIORITY</span></td>
                            <td class="text-end">
                                <a th:href="@{/projects/{pId}/tasks/{tId}/edit(pId=${task.project.id}, tId=${task.id})}" class="btn btn-sm btn-outline-primary rounded-pill px-3">
                                    Edit / Detail
                                </a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </main>

    <footer class="bg-white border-top py-3 mt-auto text-center text-muted small">
        WorkLog &amp; Task Productivity Tracker
    </footer>

</body>
</html>
