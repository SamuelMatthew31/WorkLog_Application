<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${task.id == null} ? 'Tambah Tugas Baru' : 'Edit Tugas'"></title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; color: #0f172a; }
        .card { border: 1px solid #e2e8f0; border-radius: 12px; }
        .btn-primary { background-color: #2563eb; border-color: #2563eb; }
    </style>
</head>
<body class="d-flex flex-column min-vh-100">

    <nav class="navbar navbar-expand-lg bg-white border-bottom sticky-top py-3">
        <div class="container">
            <a class="navbar-brand text-primary fw-bold d-flex align-items-center gap-2" href="/">
                <i class="bi bi-check2-square fs-4"></i>
                <span>WorkLog</span>
            </a>
        </div>
    </nav>

    <main class="container py-4 flex-grow-1" style="max-width: 680px;">
        <div class="card p-4">
            <h5 class="fw-bold mb-3 text-dark" th:text="${task.id == null} ? 'Form Tugas Baru' : 'Edit Tugas'"></h5>

            <form th:action="${task.id == null} ? @{/projects/{pId}/tasks(pId=${projectId})} : @{/projects/{pId}/tasks/{tId}/edit(pId=${projectId}, tId=${task.id})}"
                  th:object="${task}" method="post">

                <div class="mb-3">
                    <label for="title" class="form-label fw-semibold small text-secondary">Judul Tugas</label>
                    <input type="text" class="form-control" id="title" th:field="*{title}" placeholder="Contoh: Implementasi Spring Security" required>
                </div>

                <div class="row g-3 mb-3">
                    <div class="col-md-6">
                        <label for="status" class="form-label fw-semibold small text-secondary">Status</label>
                        <select class="form-select" id="status" th:field="*{status}">
                            <option th:each="st : ${statuses}" th:value="${st}" th:text="${st}"></option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label for="priority" class="form-label fw-semibold small text-secondary">Prioritas</label>
                        <select class="form-select" id="priority" th:field="*{priority}">
                            <option th:each="pr : ${priorities}" th:value="${pr}" th:text="${pr}"></option>
                        </select>
                    </div>
                </div>

                <div class="mb-4">
                    <label for="description" class="form-label fw-semibold small text-secondary">Deskripsi Tugas</label>
                    <textarea class="form-control" id="description" th:field="*{description}" rows="4" placeholder="Detail langkah teknis pekerjaan..."></textarea>
                </div>

                <div class="d-flex justify-content-end gap-2">
                    <a th:href="@{/projects/{id}(id=${projectId})}" class="btn btn-light rounded-3 px-4">Batal</a>
                    <button type="submit" class="btn btn-primary rounded-3 px-4" th:text="${task.id == null} ? 'Simpan Tugas' : 'Perbarui Tugas'"></button>
                </div>
            </form>
        </div>
    </main>

    <footer class="bg-white border-top py-3 mt-auto text-center text-muted small">
        WorkLog &amp; Task Productivity Tracker
    </footer>

</body>
</html>
