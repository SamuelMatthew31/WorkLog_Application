<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: layout(${task.title}, ~{::div#content})}">
<body>
<div id="content">

    <!-- Header Tugas -->
    <div class="card p-4 mb-4">
        <a th:href="@{/projects/{id}(id=${task.project.id})}" class="text-decoration-none small text-secondary mb-2 d-inline-block">
            <i class="bi bi-arrow-left"></i> Kembali ke Proyek: <span class="fw-semibold" th:text="${task.project.name}">Proyek</span>
        </a>
        <div class="d-flex justify-content-between align-items-start">
            <div>
                <h4 class="fw-bold text-dark mb-2" th:text="${task.title}">Judul Tugas</h4>
                <p class="text-secondary small mb-3" th:text="${task.description}">Deskripsi tugas...</p>

                <div class="d-flex gap-2 align-items-center">
                    <span class="badge bg-light text-dark border fw-normal" th:text="'Prioritas: ' + ${task.priority.displayName}">HIGH</span>
                    <span class="badge" th:classappend="'badge-' + ${#strings.toLowerCase(task.status)}" th:text="${task.status.displayName}">IN_PROGRESS</span>
                </div>
            </div>

            <!-- Fast Status Update Dropdown -->
            <form th:action="@{/tasks/{id}/status(id=${task.id})}" method="post" class="d-flex align-items-center gap-2">
                <select name="status" class="form-select form-select-sm" onchange="this.form.submit()">
                    <option th:each="s : ${statuses}" th:value="${s}" th:text="${s.displayName}" th:selected="${s == task.status}"></option>
                </select>
            </form>
        </div>
    </div>

    <div class="row g-4">
        <!-- Input WorkLog / Jam Kerja -->
        <div class="col-md-5">
            <div class="card p-4">
                <h6 class="fw-bold mb-3"><i class="bi bi-clock-history me-1"></i> Catat Waktu Kerja</h6>
                <form th:action="@{/worklogs/add}" th:object="${newWorkLog}" method="post">
                    <input type="hidden" name="taskId" th:value="${task.id}" />

                    <div class="mb-3">
                        <label for="durationMinutes" class="form-label small fw-semibold">Durasi (dalam menit)</label>
                        <input type="number" th:field="*{durationMinutes}" class="form-control form-control-sm" id="durationMinutes" placeholder="Contoh: 45" min="1" required>
                    </div>

                    <div class="mb-3">
                        <label for="logDescription" class="form-label small fw-semibold">Aktivitas yang Dikerjakan</label>
                        <textarea th:field="*{description}" class="form-control form-control-sm" id="logDescription" rows="3" placeholder="Sebutkan detail pekerjaan dalam durasi tersebut..." required></textarea>
                    </div>

                    <button type="submit" class="btn btn-primary btn-sm w-100">Tambah Log Waktu</button>
                </form>
            </div>
        </div>

        <!-- Riwayat WorkLog & Total Waktu -->
        <div class="col-md-7">
            <div class="card p-4">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h6 class="fw-bold mb-0">Riwayat Pengerjaan</h6>
                    <div class="badge bg-primary-subtle text-primary border border-primary-subtle px-3 py-2 fs-6">
                        Total: <span th:text="${totalDuration}">0</span> Menit
                    </div>
                </div>

                <div th:if="${#lists.isEmpty(worklogs)}" class="text-center py-4 text-muted small">
                    Belum ada log waktu untuk tugas ini.
                </div>

                <ul class="list-group list-group-flush" th:unless="${#lists.isEmpty(worklogs)}">
                    <li th:each="log : ${workLogs}" class="list-group-item px-0 py-3">
                        <div class="d-flex justify-content-between align-items-start">
                            <div>
                                <div class="fw-semibold text-dark" th:text="${log.description}">Detail pengerjaan</div>
                                <div class="small text-muted" th:text="${#temporals.format(log.loggedAt, 'dd MMM yyyy HH:mm')}">01 Jan 2026 10:00</div>
                            </div>
                            <div class="d-flex align-items-center gap-2">
                                <span class="badge bg-secondary-subtle text-secondary" th:text="${log.durationMinutes} + ' mnt'">30 mnt</span>
                                <form th:action="@{/worklogs/{id}/delete(id=${log.id})}" method="post" class="d-inline" onsubmit="return confirm('Hapus log ini?');">
                                    <input type="hidden" name="taskId" th:value="${task.id}" />
                                    <button type="submit" class="btn btn-sm btn-link text-danger p-0 ms-1 text-decoration-none"><i class="bi bi-x-circle"></i></button>
                                </form>
                            </div>
                        </div>
                    </li>
                </ul>
            </div>
        </div>
    </div>

</div>
</body>
</html>
