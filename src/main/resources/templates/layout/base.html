<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:fragment="layout(title, content)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title} + ' - WorkLog Tracker'">WorkLog Tracker</title>
    <!-- Bootstrap 5.3 & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #f8fafc;
            color: #0f172a;
        }
        .navbar-brand {
            font-weight: 700;
            letter-spacing: -0.02em;
        }
        .card {
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.05);
            transition: all 0.2s ease;
        }
        .card:hover {
            box-shadow: 0 4px 12px 0 rgba(0, 0, 0, 0.05);
        }
        .btn-primary {
            background-color: #2563eb;
            border-color: #2563eb;
            font-weight: 500;
        }
        .btn-primary:hover {
            background-color: #1d4ed8;
            border-color: #1d4ed8;
        }
        .badge-todo { background-color: #f1f5f9; color: #475569; border: 1px solid #cbd5e1; }
        .badge-in_progress { background-color: #dbeafe; color: #1e40af; border: 1px solid #bfdbfe; }
        .badge-done { background-color: #dcfce7; color: #166534; border: 1px solid #bbf7d0; }
        .badge-blocked { background-color: #fee2e2; color: #991b1b; border: 1px solid #fecaca; }
    </style>
</head>
<body class="d-flex flex-column min-vh-100">

    <nav class="navbar navbar-expand-lg bg-white border-bottom sticky-top py-3">
        <div class="container">
            <a class="navbar-brand text-primary d-flex align-items-center gap-2" href="/projects">
                <i class="bi bi-check2-square fs-4"></i>
                <span>WorkLog</span>
            </a>
            <div class="navbar-nav ms-auto gap-2">
                <a class="btn btn-light btn-sm rounded-pill px-3" href="/projects">
                    <i class="bi bi-folder2-open me-1"></i> Proyek
                </a>
                <a class="btn btn-primary btn-sm rounded-pill px-3" href="/projects/new">
                    <i class="bi bi-plus-lg me-1"></i> Proyek Baru
                </a>
            </div>
        </div>
    </nav>

    <main class="container py-4 flex-grow-1">
        <div th:replace="${content}"></div>
    </main>

    <footer class="bg-white border-top py-3 mt-auto">
        <div class="container text-center text-muted small">
            WorkLog &amp; Task Productivity Tracker &bull; Spring Boot Application
        </div>
    </footer>

    <script href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
