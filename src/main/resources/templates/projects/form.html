<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${project.id == null} ? 'Buat Proyek Baru' : 'Edit Proyek'"></title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; color: #0f172a; }
        .card { border: 1px solid #e2e8f0; border-radius: 12px; }
        .btn-primary { background-color: #2563eb; border-color: #2563eb; }
    </style>
</head>
<body class="d-flex flex-column min-vh-100">

    <nav class="navbar navbar-expand-lg bg-white border-bottom sticky-top py-3">
        <div class="container">
            <a class="navbar-brand text-primary fw-bold d-flex align-items-center gap-2" href="/">
                <i class="bi bi-check2-square fs-4"></i>
                <span>WorkLog</span>
            </a>
            <div class="navbar-nav ms-auto">
                <a class="btn btn-outline-secondary btn-sm rounded-pill px-3" href="/projects">
                    <i class="bi bi-arrow-left me-1"></i> Kembali ke Proyek
                </a>
            </div>
        </div>
    </nav>

    <main class="container py-4 flex-grow-1" style="max-width: 680px;">
        <div class="card p-4">
            <h5 class="fw-bold mb-3 text-dark" th:text="${project.id == null} ? 'Form Proyek Baru' : 'Edit Proyek'"></h5>

            <form th:action="${project.id == null} ? @{/projects} : @{/projects/{id}/edit(id=${project.id})}"
                  th:object="${project}" method="post">

                <div class="mb-3">
                    <label for="name" class="form-label fw-semibold small text-secondary">Nama Proyek</label>
                    <input type="text" class="form-control" id="name" th:field="*{name}" placeholder="Contoh: Modernisasi Core API" required>
                </div>

                <div class="mb-4">
                    <label for="description" class="form-label fw-semibold small text-secondary">Deskripsi Proyek</label>
                    <textarea class="form-control" id="description" th:field="*{description}" rows="4" placeholder="Jelaskan cakupan dan tujuan dari proyek ini..."></textarea>
                </div>

                <div class="d-flex justify-content-end gap-2">
                    <a href="/projects" class="btn btn-light rounded-3 px-4">Batal</a>
                    <button type="submit" class="btn btn-primary rounded-3 px-4" th:text="${project.id == null} ? 'Simpan Proyek' : 'Perbarui Proyek'"></button>
                </div>
            </form>
        </div>
    </main>

    <footer class="bg-white border-top py-3 mt-auto text-center text-muted small">
        WorkLog &amp; Task Productivity Tracker
    </footer>

</body>
</html>
