<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${project.name} + ' - Kanban Board'"></title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; color: #0f172a; }
        .kanban-col { background-color: #f1f5f9; border-radius: 12px; padding: 16px; min-height: 550px; }
        .kanban-card { border: 1px solid #e2e8f0; border-radius: 10px; background-color: #ffffff; transition: transform 0.15s ease; }
        .kanban-card:hover { transform: translateY(-2px); box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
    </style>
</head>
<body class="d-flex flex-column min-vh-100">

    <nav class="navbar navbar-expand-lg bg-white border-bottom sticky-top py-3">
        <div class="container-fluid px-4">
            <a class="navbar-brand text-primary fw-bold d-flex align-items-center gap-2" href="/">
                <i class="bi bi-check2-square fs-4"></i>
                <span>WorkLog</span>
            </a>
            <div class="navbar-nav ms-auto gap-2">
                <a class="btn btn-outline-secondary btn-sm rounded-pill px-3" th:href="@{/projects/{id}(id=${project.id})}">
                    <i class="bi bi-list-task me-1"></i> Mode List
                </a>
                <a class="btn btn-primary btn-sm rounded-pill px-3" th:href="@{/projects/{id}/tasks/new(id=${project.id})}">
                    <i class="bi bi-plus-lg me-1"></i> Tugas Baru
                </a>
            </div>
        </div>
    </nav>

    <main class="container-fluid px-4 py-4 flex-grow-1">

        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h4 class="fw-bold mb-1" th:text="${project.name} + ' — Papan Kanban'"></h4>
                <p class="text-secondary small mb-0">Geser atau ubah status tugas secara langsung antar kolom</p>
            </div>
        </div>

        <!-- KANBAN BOARD GRID -->
        <div class="row g-3">
            <div class="col-md-3" th:each="st : ${allStatuses}">
                <div class="kanban-col">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h6 class="fw-bold mb-0 text-uppercase small tracking-wide" th:text="${st}">STATUS</h6>
                        <span class="badge bg-white text-dark border rounded-pill"
                              th:text="${kanbanMap.get(st) != null ? #lists.size(kanbanMap.get(st)) : 0}">0</span>
                    </div>

                    <!-- TUGAS DI DALAM KOLOM -->
                    <div th:if="${kanbanMap.get(st) != null}">
                        <div class="card kanban-card p-3 mb-3" th:each="task : ${kanbanMap.get(st)}">
                            <h6 class="fw-bold text-dark mb-2" th:text="${task.title}">Judul Tugas</h6>
                            <p class="text-secondary small mb-3" th:text="${#strings.abbreviate(task.description, 80)}">Deskripsi...</p>

                            <div class="d-flex justify-content-between align-items-center mb-3">
                                <span class="badge bg-secondary-subtle text-secondary small" th:text="${task.priority}">PRIORITY</span>
                                <a th:href="@{/projects/{pId}/tasks/{tId}/edit(pId=${project.id}, tId=${task.id})}" class="text-secondary small">
                                    <i class="bi bi-pencil-square"></i> Edit
                                </a>
                            </div>

                            <!-- FORM PENGUBAH STATUS CEPAT -->
                            <form th:action="@{/projects/{pId}/tasks/{tId}/status(pId=${project.id}, tId=${task.id})}" method="post">
                                <select name="newStatus" class="form-select form-select-sm" onchange="this.form.submit()">
                                    <option th:each="targetStatus : ${allStatuses}"
                                            th:value="${targetStatus}"
                                            th:text="'Pindah ke: ' + ${targetStatus}"
                                            th:selected="${targetStatus == task.status}"></option>
                                </select>
                            </form>
                        </div>
                    </div>

                    <div th:if="${kanbanMap.get(st) == null or #lists.isEmpty(kanbanMap.get(st))}"
                         class="text-center py-4 text-muted small border border-dashed rounded-3">
                        Tidak ada tugas
                    </div>
                </div>
            </div>
        </div>

    </main>

    <footer class="bg-white border-top py-3 mt-auto text-center text-muted small">
        WorkLog &amp; Task Productivity Tracker
    </footer>

</body>
</html>
