<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${project.name} + ' - Detail Proyek'"></title>
    <!-- Bootstrap 5.3 & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; color: #0f172a; }
        .card { border: 1px solid #e2e8f0; border-radius: 12px; }
        .btn-primary { background-color: #2563eb; border-color: #2563eb; }
    </style>
</head>
<body class="d-flex flex-column min-vh-100">

    <nav class="navbar navbar-expand-lg bg-white border-bottom sticky-top py-3">
        <div class="container">
            <a class="navbar-brand text-primary fw-bold d-flex align-items-center gap-2" href="/">
                <i class="bi bi-check2-square fs-4"></i>
                <span>WorkLog</span>
            </a>
            <div class="navbar-nav ms-auto">
                <a class="btn btn-outline-secondary btn-sm rounded-pill px-3" href="/projects">
                    <i class="bi bi-arrow-left me-1"></i> Kembali ke Daftar Proyek
                </a>
            </div>
        </div>
    </nav>

    <main class="container py-4 flex-grow-1">

        <!-- HEADER DETAIL PROYEK -->
        <div class="card p-4 mb-4">
            <div class="d-flex justify-content-between align-items-start">
                <div>
                    <h4 class="fw-bold mb-1" th:text="${project.name}">Nama Proyek</h4>
                    <p class="text-secondary small mb-0" th:text="${project.description}">Deskripsi proyek...</p>
                </div>

                <!-- 1. POSISI TOMBOL EDIT PROYEK -->
                <div class="d-flex gap-2">
                    <a th:href="@{/projects/{id}/edit(id=${project.id})}" class="btn btn-outline-secondary btn-sm rounded-pill px-3">
                        <i class="bi bi-pencil me-1"></i> Edit Proyek
                    </a>
                    <a th:href="@{/projects/{id}/tasks/new(id=${project.id})}" class="btn btn-primary btn-sm rounded-pill px-3">
                        <i class="bi bi-plus-lg me-1"></i> Tambah Tugas Baru
                    </a>
                    <a th:href="@{/projects/{id}/kanban(id=${project.id})}" class="btn btn-outline-primary btn-sm rounded-pill px-3">
                        <i class="bi bi-kanban me-1"></i> Tampilan Kanban
                    </a>
                </div>
            </div>
        </div>

        <!-- DAFTAR TUGAS DALAM PROYEK -->
        <h5 class="fw-bold mb-3"><i class="bi bi-list-check me-2"></i>Daftar Tugas</h5>

        <div th:if="${#lists.isEmpty(project.tasks)}" class="text-center py-5 bg-white rounded-3 border">
            <i class="bi bi-clipboard-x display-5 text-muted"></i>
            <h6 class="mt-3 text-secondary">Belum ada tugas pada proyek ini</h6>
            <a th:href="@{/projects/{id}/tasks/new(id=${project.id})}" class="btn btn-outline-primary btn-sm mt-2">
                <i class="bi bi-plus-circle me-1"></i> Tambah Tugas Pertama
            </a>
        </div>

        <div class="row g-3" th:unless="${#lists.isEmpty(project.tasks)}">
            <!-- PERULANGAN SETIAP TUGAS -->
            <div class="col-md-6" th:each="task : ${project.tasks}">
                <div class="card p-3 h-100">
                    <div class="d-flex justify-content-between align-items-start mb-2">
                        <h6 class="fw-bold mb-0 text-dark" th:text="${task.title}">Judul Tugas</h6>

                        <!-- 2. POSISI TOMBOL EDIT TUGAS -->
                        <div class="d-flex align-items-center">
                            <a th:href="@{/projects/{pId}/tasks/{tId}/edit(pId=${project.id}, tId=${task.id})}"
                               class="btn btn-sm btn-link text-secondary p-0 me-2"
                               title="Edit Tugas">
                                <i class="bi bi-pencil-square fs-6"></i>
                            </a>
                            <span class="badge bg-light text-dark border" th:text="${task.status}">STATUS</span>
                        </div>
                    </div>

                    <p class="text-secondary small mb-3" th:text="${task.description}">Deskripsi tugas...</p>

                    <div class="mt-auto pt-2 border-top d-flex justify-content-between align-items-center">
                        <span class="badge bg-secondary-subtle text-secondary small" th:text="'Prioritas: ' + ${task.priority}">Priority</span>

                        <a th:href="@{/projects/{pId}/tasks/{tId}/edit(pId=${project.id}, tId=${task.id})}" class="btn btn-sm btn-outline-primary rounded-pill px-3">
                            Kelola / Edit <i class="bi bi-arrow-right ms-1"></i>
                        </a>
                    </div>
                </div>
            </div>
        </div>

    </main>

    <footer class="bg-white border-top py-3 mt-auto text-center text-muted small">
        WorkLog &amp; Task Productivity Tracker
    </footer>

</body>
</html>
