<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: layout(${project.name}, ~{::div#content})}">
<body>
<div id="content">

    <!-- Header Proyek -->
    <div class="card p-4 mb-4">
        <div class="d-flex justify-content-between align-items-start">
            <div>
                <a href="/projects" class="text-decoration-none small text-secondary mb-2 d-inline-block">
                    <i class="bi bi-arrow-left"></i> Kembali ke Daftar Proyek
                </a>
                <h3 class="fw-bold text-dark mb-2" th:text="${project.name}">Nama Proyek</h3>
                <p class="text-secondary mb-0" th:text="${project.description}">Deskripsi proyek...</p>
            </div>
            <a th:href="@{/tasks/new(projectId=${project.id})}" class="btn btn-primary btn-sm rounded-pill px-3">
                <i class="bi bi-plus-lg me-1"></i> Tambah Tugas
            </a>
        </div>
    </div>

    <!-- Tabel Daftar Tugas -->
    <div class="card p-3">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h6 class="fw-bold mb-0">Daftar Tugas dalam Proyek</h6>
            <span class="small text-muted" th:text="${#lists.size(tasks)} + ' Tugas Total'">0 Tugas</span>
        </div>

        <div th:if="${#lists.isEmpty(tasks)}" class="text-center py-4 text-muted small">
            Belum ada tugas di dalam proyek ini. Klik tombol <strong>Tambah Tugas</strong> untuk memulai.
        </div>

        <div class="table-responsive" th:unless="${#lists.isEmpty(tasks)}">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                    <tr class="small text-secondary">
                        <th>Judul Tugas</th>
                        <th>Prioritas</th>
                        <th>Status</th>
                        <th class="text-end">Aksi</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="task : ${tasks}">
                        <td>
                            <a th:href="@{/tasks/{id}(id=${task.id})}" class="fw-semibold text-dark text-decoration-none" th:text="${task.title}">Judul Tugas</a>
                        </td>
                        <td>
                            <span class="badge bg-light text-dark border fw-normal" th:text="${task.priority.displayName}">MEDIUM</span>
                        </td>
                        <td>
                            <span class="badge" th:classappend="'badge-' + ${#strings.toLowerCase(task.status)}" th:text="${task.status.displayName}">TODO</span>
                        </td>
                        <td class="text-end">
                            <a th:href="@{/tasks/{id}(id=${task.id})}" class="btn btn-sm btn-outline-secondary me-1">Detail</a>
                            <form th:action="@{/tasks/{id}/delete(id=${task.id})}" method="post" class="d-inline" onsubmit="return confirm('Hapus tugas ini?');">
                                <button type="submit" class="btn btn-sm btn-link text-danger p-0 ms-2 text-decoration-none"><i class="bi bi-trash"></i></button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

</div>
</body>
</html>
