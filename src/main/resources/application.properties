# ==========================================
# Application & Server Configuration
# ==========================================
spring.application.name=worklog-tracker
server.port=8080

# ==========================================
# Database Configuration (H2 In-Memory)
# ==========================================
spring.datasource.url=jdbc:h2:mem:worklogdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ==========================================
# JPA & Hibernate Settings
# ==========================================
# Mengizinkan Hibernate membuat/memperbarui tabel database otomatis berdasarkan Entity Java
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ==========================================
# Thymeleaf Template Settings
# ==========================================
# Mematikan cache agar perubahan HTML langsung terlihat tanpa restart server
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
